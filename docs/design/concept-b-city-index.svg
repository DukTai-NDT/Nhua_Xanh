<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Concept B — Mục lục đô thị</title><desc id="desc">Phác thảo tĩnh Header/Footer desktop và mobile, bố cục dạng mục lục biên tập với màu xanh rừng và dấu chỉ mục đất nung.</desc>
  <rect width="1600" height="1000" fill="#F2F0E7"/>
